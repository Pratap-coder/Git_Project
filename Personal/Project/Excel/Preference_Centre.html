function getToken(setup) {

        var config = {
            url : setup.authBaseURI + "v2/token",
            contentType : "application/json",
            payload : {
                "client_id": setup.clientId,
                "client_secret": setup.clientSecret,
                "grant_type": "client_credentials"
            }
        }

        var req = HTTP.Post(config.url, config.contentType, Stringify(config.payload));

        if (req.StatusCode == 200) {
            var res = Platform.Function.ParseJSON(req.Response[0]);
            return res.access_token;
        } else {
            return false;
        }
    }



  
function optOutContact(setup, accessToken, mobileNumber, contactKey) {
    var url = setup.restBaseURI + "sms/v1/queueMO";
    var payload = {
        "subscribers":[
         {
           "mobilenumber": mobileNumber,
           "subscriberkey": contactKey
         }
        ],
        "shortCode": "36962",
        "messageText": "STOPXL" 
    };
    var headers = ["Authorization"];
    var values = ["Bearer " + accessToken];    
    var req = HTTP.Post(url, "application/json", Stringify(payload), headers, values);

    if (req.StatusCode == 202) {
        return true;
    } else {
        return req.Response[0];
    }
}  
  
function optInContact(setup, accessToken, mobileNumber, contactKey) {
    var url = setup.restBaseURI + "sms/v1/queueMO";

         }
        ],
        "shortCode": "36962",
        "messageText": "EXCELIAMARKETING" 
    };
    var headers = ["Authorization"];
    var values = ["Bearer " + accessToken];    
    var req = HTTP.Post(url, "application/json", Stringify(payload), headers, values);

    if (req.StatusCode == 202) {
        return true;
    } else {
        return req.Response[0];
    }
}
  
</script>
  
<script>
    // Function to get URL parameters
    function getQueryParam(param) {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get(param);
    }

    // Show confirmation if submitted=true
    window.addEventListener('DOMContentLoaded', () => {
        if (getQueryParam('submitted') === 'true') {
            const confirmation = document.getElementById('confirmation');
            confirmation.style.display = 'block';

            
setTimeout(() => {
    confirmation.style.display = 'none';
    // Supprimer le paramètre de l'URL sans recharger
    const url = new URL(window.location);
    url.searchParams.delete('submitted');
    window.history.replaceState({}, document.title, url.toString());
}, 3000);

        }
    });
</script>
