<!DOCTYPE html>
<html>
<head>
 <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
 <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
 <link rel="icon" type="image/x-icon" href="https://image.crm.excelia-group.com/lib/fe2d11737364047a7d1673/m/1/b1444a8c-59ba-43b9-99fa-6e3273c6b040.png">
</head>
<body>

<!-- %%=ContentBlockById("323217")=%% -->

<script runat="server">
Platform.Load("Core","1.1.1");
try {
  var SMSMarketingConsentOld = Variable.GetValue("@SMSMarketingConsentOld");
  var SMSMarketingConsent = Variable.GetValue("@SMSMarketingConsent");
  var submitted = Variable.GetValue("@submitted");
  var mobileNumber = Variable.GetValue("@mobileNumber");
  var subscriberKey = Variable.GetValue("@subscriberKey");
  
  /* --- NEW: RETRIEVE CREDENTIALS FROM DATA EXTENSION --- */
  // Change these variables if your Data Extension or Column names are different
  var deName = "API_Credentials"; 
  var lookupColumn = "SystemName";
  var lookupValue = "MobileConnect"; // The value in the row you want to retrieve
  
  var credentialRows = Platform.Function.LookupRows(deName, lookupColumn, lookupValue);
  
  if (credentialRows && credentialRows.length > 0) {
      // Build the setup object using the values from the Data Extension
      var setup = {
          authBaseURI: credentialRows[0]["AuthBaseURI"],
          restBaseURI: credentialRows[0]["RestBaseURI"],
          clientId: credentialRows[0]["ClientId"],
          clientSecret: credentialRows[0]["ClientSecret"]
      };
      
      // Proceed with API call if the form was submitted
      if (submitted == "true" && mobileNumber) {
          
          var keyword = null;
          if (SMSMarketingConsentOld == "true" && SMSMarketingConsent == "false") {
              keyword = "STOPXL";
          } else if (SMSMarketingConsentOld == "false" && SMSMarketingConsent == "true") {
              keyword = "EXCELIAMARKETING";
          }

          if (keyword !== null) {
              var accessToken = getToken(setup); 
              if (accessToken) {
                  var result = queueSMSKeyword(setup, accessToken, mobileNumber, subscriberKey, keyword);
              }
          }
      }
      
  } else {
      // Fallback/Error logging if the DE row is not found
      // Write("Credentials not found in Data Extension.");
  }

} catch(e) {
  // Silent catch. Consider writing to an Error Log DE for debugging.
}

/* --- HELPER FUNCTIONS --- */
function getToken(setup) {
    var config = {
        url : setup.authBaseURI + "v2/token",
        contentType : "application/json",
        payload : {
            "client_id": setup.clientId,
            "client_secret": setup.clientSecret,
            "grant_type": "client_credentials"
        }
    };
    var req = HTTP.Post(config.url, config.contentType, Stringify(config.payload));
    if (req.StatusCode == 200) {
        var res = Platform.Function.ParseJSON(req.Response[0]);
        return res.access_token;
    }
    return false;
}

function queueSMSKeyword(setup, accessToken, mobileNumber, contactKey, keywordText) {
    var url = setup.restBaseURI + "sms/v1/queueMO";
    var payload = {
        "subscribers": [{
           "mobilenumber": mobileNumber,
           "subscriberkey": contactKey
        }],
        "shortCode": "36962",
        "messageText": keywordText 
    };
    var headers = ["Authorization"];
    var values = ["Bearer " + accessToken];    
    var req = HTTP.Post(url, "application/json", Stringify(payload), headers, values);

    return req.StatusCode == 202 ? true : false;
}  
</script>
  
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        
        if (urlParams.get('submitted') === 'true' || document.querySelector('input[name="submitted"]')) {
            const confirmation = document.getElementById('confirmation');
            if(confirmation) {
                confirmation.style.display = 'block';
                setTimeout(() => {
                    confirmation.style.display = 'none';
 
                    const url = new URL(window.location);
                    url.searchParams.delete('submitted');
                    window.history.replaceState({}, document.title, url.toString());
                }, 3000);
            }
        }
    });
</script>
</body>
</html>
